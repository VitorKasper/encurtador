<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Não Encontrado | Encurtador de URL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="background-glow">
        <div class="glow-sphere glow-1"></div>
        <div class="glow-sphere glow-2"></div>
    </div>

    <div class="app-container" style="justify-content: center; min-height: 90vh;">
        <div class="main-card error-card">
            <div class="error-badge">404</div>
            <h1 class="hero-title" style="margin-bottom: 0.5rem;">Link não encontrado</h1>
            <p class="hero-subtitle" style="margin-bottom: 1.5rem;">
                O código encurtado <span class="code-badge">#{{ codigo }}</span> não foi localizado ou expirou da memória da sessão.
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="/" class="btn-primary" style="text-decoration: none; padding: 0.75rem 1.5rem;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Ir para o Início & Encurtar</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
